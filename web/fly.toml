# fly.toml — Cordon landing page + playground.
#
# First deploy:
#   fly launch --no-deploy --copy-config --name cordon-demo
#   fly deploy --remote-only
#
# Subsequent deploys:
#   fly deploy --remote-only

app          = "cordon-demo"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port      = 8080
  force_https        = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes          = ["app"]

  [http_service.concurrency]
    type       = "requests"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    interval     = "30s"
    timeout      = "5s"
    grace_period = "10s"
    method       = "get"
    path         = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
